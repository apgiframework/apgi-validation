    chunk_size: 100
    max_workers: 4
    timeout: 300
    use_processes: false
  data:
    cache_dir: cache
    default_data_dir: data
    eeg_channels: 32
    enable_caching: true
    max_file_size_mb: 100
    max_load_size_mb: 100
    sample_size: 1000
    sampling_rate: 1000
