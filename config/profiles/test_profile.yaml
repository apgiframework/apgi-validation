    somatic_hidden_dim: 32
    tau_M: 1.52
    tau_S: 0.5
    tau_theta: 30.0
    theta_0: 0.5
    value_learning_rate: 0.001
  simulation:
    cv_folds: 5
    default_dt: 0.01
    default_steps: 1000
    enable_cross_validation: true
    enable_plots: true
    enable_robustness_tests: true
    enable_sensitivity_analysis: true
    max_steps: 100000
    plot_dpi: 150
    plot_format: png
    results_format: csv
    save_results: true
    sensitivity_samples: 100
    significance_level: 0.05
  validation:
    cv_folds: 5
    enable_cross_validation: true
    enable_robustness_tests: true
    enable_sensitivity_analysis: true
