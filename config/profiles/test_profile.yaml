    enable_console: true
    enable_performance_logging: true
    enable_structured_logging: true
    level: INFO
    log_directory: apgi_outputs/logs/
    log_retention: 30 days
    log_rotation: 10 MB
  model:
    F6:
      delta_auroc_min: 0.05
    F6_2_FALSIFICATION_RATIO: 2.5
    F6_2_MIN_CURVE_FIT_R2: 0.85
