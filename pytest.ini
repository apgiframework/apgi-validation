[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
# Coverage is measured across whole packages, not a hand-picked list of ten
# modules. The previous scope excluded all 111 utils modules, every GUI and
# every protocol, so the reported figure described almost none of the shipped
# code.
addopts =
    --cov=apgi_core
    --cov=utils
    --cov=gui
    --cov=main
    --cov=Validation_GUI
    --cov=Protocols_GUI
    --cov=Falsification_GUI
    --cov=OSF_GUI
    --cov=Utils_GUI
    --cov=Tests_GUI
    --cov=Theory_GUI
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=55
    --cov-config=.coveragerc
    --strict-markers
    --durations=10
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    performance: marks tests as performance tests
    hypothesis: marks tests as hypothesis-based property tests
    boundary: marks tests as boundary value analysis tests
    regression: marks tests as regression tests
    parameter_recovery: marks test for parameter recovery validation
    functional: marks tests testing functional requirements
    timeout: marks tests with timeout
filterwarnings =
    # Only ignore specific deprecation warnings from third-party libraries
    ignore::DeprecationWarning:pkg_resources.*
    ignore::DeprecationWarning:tensorflow.*
    # Convert pending deprecation warnings to errors to catch early
    error::PendingDeprecationWarning
