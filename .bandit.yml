# Bandit Security Scanner Configuration
# Excludes test files from assert warnings (B101) as they are standard pytest practice

skips:
  # Skip assert warnings globally - standard pytest practice
  - 'B101'
  # Skip hardcoded password false positives - these are intentional nosec comments
  - 'B105'

exclude_dirs:
  - ./tests
  - ./test
  - tests/
  - test/
  - ./.git
  - ./__pycache__
  - ./.mypy_cache
  - ./venv
  - ./env
  - ./.venv
  - ./.env
  - ./node_modules

# Severity/confidence policy (MEDIUM+ at MEDIUM+ confidence) is NOT expressible
# in this file: Bandit ignores unknown keys, so the former `severity:` and
# `confidence:` lists here had no effect and LOW findings failed CI (CI-BANDIT).
# The policy is applied with the supported CLI flags in
# .github/workflows/security.yml:  --severity-level medium --confidence-level medium
