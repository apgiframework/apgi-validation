name: Test Suite

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests must never touch real operator key material.
  APGI_ALLOW_EPHEMERAL_MASTER_KEY: "1"
  APGI_LOG_LEVEL: "WARNING"

jobs:
  lockfile:
    name: Lockfile is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Regenerating must be a no-op. A drifting lock means the pinned set no
      # longer matches the declared requirements, and builds stop being
      # reproducible.
      - name: Verify requirements.lock matches requirements.txt
        run: make lock-check

  unit:
    name: Unit + integration (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Schema, cross-field and MANIFEST checks for protocols/ (release 1.1.0),
      # the same gate apgi-framework runs on its copy of the specification.
      - name: Validate protocol specification
        run: python scripts/validate_protocols.py

      # The full suite, with the coverage gate from pytest.ini enforced.
      # No `|| true`: a failing test fails the build.
      - name: Run test suite
        run: pytest -q --timeout=300 -m "not slow"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/

  slow:
    name: Slow protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Long-running protocol executions, split out so the main job stays fast.
      - name: Run slow tests
        run: pytest -q --no-cov --timeout=1800 -m "slow"
