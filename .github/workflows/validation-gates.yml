name: Validation gates

# XC-CI-05: the three apgi-validation gates. Each job is a separately named
# status check so branch protection can require it (CI-PROTECTION).

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validation-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  APGI_ALLOW_EPHEMERAL_MASTER_KEY: "1"
  APGI_LOG_LEVEL: "WARNING"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  registered-rules:
    name: "Gate: registered rules (XC-CI-05.1)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements.lock
      - name: Protocol schema, semantics and MANIFEST
        run: python scripts/validate_protocols.py
      - name: Runtime protocol lock (trust anchor + per-file SHA-256)
        run: python -m utils.protocol_lock
      - name: Lock enforcement tests
        run: pytest -q --no-cov -p no:randomly tests/test_protocol_lock_enforcement.py tests/test_protocol_spec_v1_1.py

  synthetic-fixtures:
    name: "Gate: synthetic fixtures (XC-CI-05.2)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements.lock
      # Golden vectors, equality boundary, L0–L4 boundaries, statistical
      # arithmetic, seeded bitwise repetition, estimator reference values.
      - name: Scientific conformance and estimator fixtures
        run: |
          pytest -q --no-cov -p no:randomly \
            tests/test_scientific_conformance.py \
            tests/test_psychometrics.py \
            tests/test_theory_equations_core.py

  result-classification:
    name: "Gate: result classification (XC-CI-05.3)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements.lock
      - name: K-gate classification, provenance and signed reports
        run: |
          pytest -q --no-cov -p no:randomly \
            tests/test_kgate_classification.py \
            tests/test_provenance_and_reports.py \
            tests/test_data_governance_controls.py
      - name: Release package, terminology and certificate gate
        run: |
          python scripts/build_release_package.py --check
          python scripts/scan_terminology.py
          pytest -q --no-cov -p no:randomly tests/test_release_and_terminology.py
