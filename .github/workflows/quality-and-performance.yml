name: quality-and-performance

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

env:
  APGI_ALLOW_EPHEMERAL_MASTER_KEY: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Rule selection lives in [tool.ruff] in pyproject.toml and mirrors the
      # project's established .flake8 standard.
      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Import order check (isort)
        run: isort --check-only .

      # Type checking is a RATCHET, not a blanket gate. `mypy --strict` across
      # the four modules previously named here reports 220 pre-existing errors,
      # so that step could never pass and the workflow stayed disabled.
      #
      # This list holds modules that are clean today. Add to it as modules are
      # annotated; never remove an entry to make a build pass.
      - name: Type check (clean-module allowlist)
        run: |
          mypy --ignore-missing-imports \
            utils/secure_key_manager.py \
            utils/secret_policy_enforcer.py \
            utils/logging_config.py \
            utils/json_serialization.py \
            utils/check_lockfile.py

      - name: Compliance traceability tests
        run: pytest -q --no-cov tests/test_compliance_control_matrix.py

      - name: Performance governance tests
        run: pytest -q --no-cov tests/test_performance_governance.py
