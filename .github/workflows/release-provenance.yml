name: Release provenance

# APGI-IMP-001 / APGI-REL-001: for every main build, build the container from
# the locked inputs and retain a build record (commit, lock and protocol-lock
# digests, base-image digest, image digest, SBOM) as a workflow artifact.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-record:
    name: Build image and record provenance
    runs-on: ubuntu-latest
    env:
      APGI_ALLOW_EPHEMERAL_MASTER_KEY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements.lock
      - name: Build container from locked inputs
        run: docker build --iidfile build-image-id.txt -t apgi-validation:${{ github.sha }} .
      - name: Write build record
        run: python scripts/build_record.py --image-digest "$(cat build-image-id.txt)" --out build/build-record.json
      - name: Upload build record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-record-${{ github.sha }}
          path: build/build-record.json
          retention-days: 90
