name: GUI Smoke Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gui-smoke:
    name: GUI smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    env:
      APGI_ENFORCE_AUTH: "0"
      APGI_ALLOW_EPHEMERAL_MASTER_KEY: "1"
      # Instructs tests/conftest.py NOT to replace tkinter with a MagicMock.
      # Without this the smoke test detects the mock and skips itself, which is
      # how this job previously stayed green while exercising no GUI at all.
      APGI_REAL_TKINTER: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Tk and virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run GUI smoke tests (Linux, headless display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest tests/test_gui_smoke_cross_platform.py -v --no-cov --timeout=300 -p no:randomly | tee gui-result.txt

      - name: Run GUI smoke tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: python -m pytest tests/test_gui_smoke_cross_platform.py -v --no-cov --timeout=300

      # A run where the widget tests all skipped is a broken configuration, not
      # a pass. Linux has a guaranteed xvfb display, so assert they executed.
      - name: Assert GUI widget tests actually ran (Linux)
        if: runner.os == 'Linux'
        run: |
          if grep -q "skipped" gui-result.txt; then
            echo "::error::GUI smoke tests skipped; tkinter was mocked or no display was available"
            exit 1
          fi
          echo "GUI widget tests executed."
